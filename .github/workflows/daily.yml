name: daily

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no network, nothing committed)"
        type: boolean
        default: false
  push:
    paths:
      - "inbox/**"

permissions:
  contents: write

# serialize runs so two jobs never process (and bill) the same posts
concurrency:
  group: x-ai-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python -m pipeline.run
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BYTECAT_API_KEY: ${{ secrets.BYTECAT_API_KEY }}
          GALLERY_PUSH_TOKEN: ${{ secrets.GALLERY_PUSH_TOKEN }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_MODEL: ${{ vars.MODELSCOPE_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # inbox files are never modified (hashes live in state/seen.json); [skip ci] stops push loops
      - name: Commit results
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data pending_videos.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "auto: pipeline run $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
